[package]
authors = ["Antti Keränen <detegr@gmail.com>", "@ssrlive"]
name = "ctrlc2"
version = "4.0.2"
description = "Easy Ctrl-C handler version 2 for Rust projects"
documentation = "https://docs.rs/ctrlc2"
homepage = "https://github.com/ssrlive/ctrlc2"
keywords = ["ctrlc", "signal", "SIGINT", "async"]
categories = ["os"]
license = "MIT/Apache-2.0"
repository = "https://github.com/ssrlive/ctrlc2.git"
exclude = ["/.travis.yml", "/appveyor.yml"]
edition = "2024"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
termination = []
async = []

# default = ["termination", "async"]

[dependencies]
log = "0.4.35"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32.0", default-features = false, features = ["signal"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Console",
] }

[dev-dependencies]
clap = { version = "4.6.8", features = ["derive"] }
futures = "0.3.34"
signal-hook = "0.4.6"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "time",
    "macros",
    "rt",
] }
tokio-util = { version = "0.7.20" }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[[test]]
harness = false
name = "main"
path = "tests/main/mod.rs"

[[test]]
harness = false
name = "issue_97"
path = "tests/main/issue_97.rs"

[badges]
maintenance = { status = "passively-maintained" }
